name: MyCam
options:
  bundleIdPrefix: com.mycam
  deploymentTarget:
    iOS: "16.0"
targets:
  MyCam:
    type: application
    platform: iOS
    sources: [MyCam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mycam.streamer
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyCam
        INFOPLIST_KEY_NSCameraUsageDescription: MyCam streams your camera to your computer.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MyCam sends video to your computer.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
